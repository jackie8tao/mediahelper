# MediaHelper 配置文件示例
server:
  host: "0.0.0.0"
  port: 9090

# 数据库存储配置
database:
  dsn: "data/mediahelper.db"

# qBittorrent 客户端配置 (单实例兼容模式)
qbittorrent:
  enabled: true
  url: "http://127.0.0.1:8080"
  username: "admin"
  password: "adminadmin"
  # 监控的分类列表 (区分大小写)，为空时监控所有分类
  categories:
    - "movie"
    - "tv"
    - "anime"
  # 自动回写标签
  auto_tag: true
  success_tag: "MediaHelper:Done"
  fail_tag: "MediaHelper:Error"
  # 轮询时间间隔 (秒)
  poll_interval: 30
  # 路径映射规则 (当 qBittorrent 与 MediaHelper 运行在不同容器或系统路径不一致时启用)
  path_mappings:
    - remote: "/downloads"
      local: "D:/Downloads"

