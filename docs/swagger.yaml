basePath: /
definitions:
  server.QBWebhookPayload:
    properties:
      category:
        type: string
      content_path:
        type: string
      hash:
        type: string
      name:
        type: string
      save_path:
        type: string
    type: object
host: localhost:9090
info:
  contact:
    name: Jackie Tao
    url: https://github.com/jackie8tao/mediahelper
  description: MediaHelper 多媒体自动化管理系统 REST API 文档，支持直接导入 Postman 进行接口联调
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: https://github.com/jackie8tao/mediahelper
  title: MediaHelper API
  version: "1.0"
paths:
  /api/v1/downloader/torrents:
    get:
      description: 获取下载器 (如 qBittorrent) 当前的所有种子任务信息
      parameters:
      - default: all
        description: 任务状态过滤 (all, downloading, completed, paused, active, inactive)
        in: query
        name: filter
        type: string
      - description: 按分类过滤 (如 movie, tv, anime)
        in: query
        name: category
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties: true
            type: object
      summary: 查询下载器任务列表
      tags:
      - 下载器
  /api/v1/history:
    get:
      description: 获取最近的影视整理历史记录
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: 查询归档执行历史
      tags:
      - 归档历史
  /api/v1/plugins:
    get:
      description: 获取系统当前加载的所有插件信息及启用状态
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: 查询插件列表
      tags:
      - 插件管理
  /api/v1/status:
    get:
      description: 查询系统配置状态、下载器地址、媒体库路径等
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: 获取系统运行状态
      tags:
      - 系统基础
  /api/v1/sync:
    post:
      description: 在后台立即触发一次未整理任务扫描与补漏整理
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: 手动触发全量同步
      tags:
      - 任务调度
  /api/v1/webhook/qbittorrent:
    post:
      consumes:
      - application/json
      - application/x-www-form-urlencoded
      description: 供 qBittorrent 下载完成后调用外部命令或 API 实时触发整理
      parameters:
      - description: 种子信息 JSON 载荷
        in: body
        name: payload
        schema:
          $ref: '#/definitions/server.QBWebhookPayload'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      summary: qBittorrent 任务完成实时通知 Webhook
      tags:
      - Webhook
  /health:
    get:
      description: 检测系统运行状态及时间戳
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: 服务探活接口
      tags:
      - 系统基础
swagger: "2.0"
